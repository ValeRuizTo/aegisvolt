# nginx del frontend: sirve la aplicacion compilada.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Usado por las sondas de Kubernetes.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Respaldo: si el frontend se usa SIN API Gateway delante (docker compose de
  # las pruebas E2E), nginx reenvia /graphql al gateway. En Kubernetes la ruta
  # /graphql la resuelve directamente el API Gateway.
  location /graphql {
    proxy_pass http://${GRAPHQL_UPSTREAM}/graphql;
    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $http_x_correlation_id;
  }

  # index.html nunca se cachea: asi una version nueva se ve de inmediato.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Los assets llevan hash en el nombre: se pueden cachear indefinidamente.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
